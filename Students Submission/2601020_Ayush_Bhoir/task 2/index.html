<!DOCTYPE html>
<html lang="en">
<head>
  <!-- These settings make the page work correctly on phones and computers -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal</title>
  <!-- This file connects the HTML to the CSS design file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The page has two main parts: a sidebar and the dashboard -->
  <div class="layout">
    <!-- The sidebar contains the logo, menu links, and logout link -->
    <aside class="sidebar">
      <div class="logo">
        <img src="../../../Task 2/Assets/17.png" alt="Student Portal logo">
        <span>Student Portal</span>
      </div>

      <!-- These links help the user move to different dashboard sections -->
      <nav class="menu">
        <a href="#" class="active">
          <img src="../../../Task 2/Assets/13.png" alt="" aria-hidden="true">
          <span>Dashboard</span>
        </a>
        <a href="#assignments">
          <img src="../../../Task 2/Assets/12.png" alt="" aria-hidden="true">
          <span>Assignments</span>
        </a>
        <a href="#courses">
          <img src="../../../Task 2/Assets/11.png" alt="" aria-hidden="true">
          <span>Courses</span>
        </a>
        <a href="#progress">
          <img src="../../../Task 2/Assets/10.png" alt="" aria-hidden="true">
          <span>Progress</span>
        </a>
        <a href="#profile">
          <img src="../../../Task 2/Assets/09.png" alt="" aria-hidden="true">
          <span>Profile</span>
        </a>
      </nav>

      <a href="#logout" class="logout">
        <img src="../../../Task 2/Assets/08.png" alt="" aria-hidden="true" width="24" height="24">
        <span>Logout</span>
      </a>
    </aside>

    <!-- The main area contains the heading and all dashboard information -->
    <div class="main-area">
      <!-- The top bar shows the page name and the student's account details -->
      <header class="topbar">
        <h1>Dashboard</h1>
        <div class="user-box">
          <img src="../../../Task 2/Assets/16.png" alt="Notifications" class="bell">
          <img src="../../../Task 2/Assets/15.png" alt="Ayush Bhoir" class="avatar">
          <span>Ayush Bhoir ▾</span>
        </div>
      </header>

      <main class="content">
        <!-- This banner welcomes the student and explains what to do next -->
        <section class="banner">
          <div class="banner-text">
            <h2>Welcome Back, Ayush Bhoir! 👋</h2>
            <p>Continue your learning journey and complete your pending assignments.</p>
          </div>
          <img src="../../../Task 2/Assets/18.png" alt="Study illustration" class="banner-img">
        </section>

        <!-- These cards give a quick view of the student's main numbers -->
        <section class="stats-grid">
          <!-- Each card has an icon, a number, and a short label -->
          <div class="stat-card purple-bg">
            <img src="../../../Task 2/Assets/04.png" alt="" aria-hidden="true">
            <div>
              <strong>3</strong>
              <p>Courses</p>
            </div>
          </div>

          <div class="stat-card green-bg">
            <img src="../../../Task 2/Assets/03.png" alt="" aria-hidden="true">
            <div>
              <strong>12</strong>
              <p>Assignments</p>
            </div>
          </div>

          <div class="stat-card yellow-bg">
            <img src="../../../Task 2/Assets/02.png" alt="" aria-hidden="true">
            <div>
              <strong>78%</strong>
              <p>Progress</p>
            </div>
          </div>

          <div class="stat-card pink-bg">
            <img src="../../../Task 2/Assets/01.png" alt="" aria-hidden="true">
            <div>
              <strong>5</strong>
              <p>Due This Week</p>
            </div>
          </div>
        </section>
